[workspace]
members = ["crates/*"]
exclude = ["benchwork"]
resolver = "3"

[workspace.package]
version = "0.3.4"
edition = "2024"

[workspace.dependencies]
fastrapi-core = { path = "crates/fastrapi-core" }
fastrapi-pyutil = { path = "crates/fastrapi-pyutil" }
fastrapi-runtime = { path = "crates/fastrapi-runtime" }
fastrapi-http = { path = "crates/fastrapi-http" }
fastrapi-routing = { path = "crates/fastrapi-routing" }
fastrapi-openapi = { path = "crates/fastrapi-openapi" }

# Pure-Rust decoupling of pydantic-core: Rust-native request validation
pydantic-core-kernel = { git = "https://github.com/ppmpreetham/pydantic", branch = "main" }
pyo3 = { version = "0.29.0", features = [
  "extension-module",
  "py-clone",
  "multiple-pymethods",
  "bytes",
  "parking_lot",
  "experimental-async",
  "experimental-inspect",
] }
pyo3-async-runtimes = { version = "0.29.0", features = ["tokio-runtime"] }
axum = "0.8.8"

tokio = { version = "1.50.0", features = ["fs", "full", "io-util", "sync"] }
tokio-util = { version = "0.7.19", features = ["io"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
serde = "1.0.228"
smallvec = "1.15.2"
smol_str = "0.3.7"
futures-util = "0.3.32"
hyper = "1.10.1"
http-body = "1.0.1"
hyper-util = { version = "0.1.20", features = ["tokio"] }
# TODO: if using python package, make these features optional
tower-http = { version = "0.6.8", features = [
  "cors",
  "trace",
  "set-header",
  "compression-gzip",
  "fs",
  "catch-panic",
  "timeout",
  "request-id",
] }
tower = "0.5.3"
cookie = { version = "0.18.1", features = ["private", "signed", "key-expansion"] }
hmac = "0.12.1"
sha1 = "0.10.6"
form_urlencoded = "1.2.2"
http-range-header = "0.4.2"
httpdate = "1.0"
globset = "0.4"
notify = "8"
papaya = { version = "0.2.3" }
parking_lot = "0.12.5"
fastwebsockets = { version = "0.10.0", features = ["upgrade", "with_axum", "unstable-split"] }

bytes = "1.12.1"
flate2 = "1.1.10"
itoa = "1.0.18"
regex = "1"
uuid = "1"
matchit = "0.9.2"
ahash = "0.8.12"
percent-encoding = "2.3.2"
multer = "3.1.0"
base64 = "0.22.1"
async-stream = "0.3.6"
simd-json = "0.18.1"
metrics-exporter-prometheus = "0.18.3"
metrics = "0.24.6"
strum = { version = "0.28.0", features = ["derive"] }
serde_json = { version = "1", features = ["arbitrary_precision", "preserve_order"] }
thiserror = "2.0.19"
smart-default = "0.7.1"
mimalloc = { version = "0.1.52", default-features = false }

[workspace.lints.rust]
future_incompatible = "warn"
nonstandard_style = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -2 }
pedantic = { level = "warn", priority = -2 }
perf = { level = "warn", priority = -1 }
complexity = { level = "warn", priority = -1 }
inline_always = "allow"
unseparated_literal_suffix = "allow"
similar_names = "allow"
missing_panics_doc = "allow"
missing_errors_doc = "allow"
absolute_paths = "allow"
module_name_repetitions = "allow"
doc_markdown = "allow"
too_many_lines = "allow"
unused_self = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
cast_precision_loss = "allow"
unreadable_literal = "allow"
implicit_hasher = "allow"

# nursery
significant_drop_tightening = "warn"
redundant_clone = "warn"
use_self = "warn"
redundant_else = "warn"
or_fun_call = "warn"
missing_const_for_fn = "warn"
derive_partial_eq_without_eq = "warn"

[profile.release]
codegen-units = 1
lto = "fat"
panic = "unwind"
strip = true
debug = true
opt-level = 3

[profile.release.build-override]
opt-level = 3

[package]
name = "fastrapi"
version.workspace = true
edition.workspace = true

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[lib]
name = "fastrapi"
crate-type = ["cdylib"]

[dependencies]
fastrapi-core.workspace = true
fastrapi-http.workspace = true
fastrapi-openapi.workspace = true
fastrapi-routing.workspace = true
fastrapi-pyutil.workspace = true
fastrapi-runtime.workspace = true
pyo3.workspace = true
axum.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
serde.workspace = true
smallvec.workspace = true
futures-util.workspace = true
hyper.workspace = true
hyper-util.workspace = true
tower-http.workspace = true
tower.workspace = true
regex.workspace = true
cookie.workspace = true
form_urlencoded.workspace = true
parking_lot.workspace = true
fastwebsockets.workspace = true
bytes.workspace = true
matchit.workspace = true
ahash.workspace = true
percent-encoding.workspace = true
multer.workspace = true
simd-json.workspace = true
metrics-exporter-prometheus.workspace = true
metrics.workspace = true
thiserror.workspace = true
smart-default.workspace = true
serde_json.workspace = true
mimalloc.workspace = true

[lints]
workspace = true
